# Profile: Low-Spec System

profile: low_spec_system
name: "Low Spec System"
description: "Lightweight profile for low-spec systems. Blocks CPU power-policy changes that raise heat on weak cooling."

blockedActions:
  - cpu.disable-core-parking
  - cpu.aggressive-boost-mode
  - cpu.min-processor-state-100
  - memory.disable-compression            # Compression helps when RAM is scarce
