# Profile Override: VM / Cautious
profile: vm_cautious
description: "Virtual machine — blocks hardware-specific and AppX operations"

blockedActions:
  - appx.*
  - gpu.tdr-delay
  - gpu.disable-nvidia-container
  - gpu.disable-amd-services
  - power.disable-device-power-saving
  - storage.disable-write-cache-flushing
