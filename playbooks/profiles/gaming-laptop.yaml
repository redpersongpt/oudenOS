# Profile: Gaming Laptop — inherits gaming_desktop, keeps battery-relevant behaviour.

profile: gaming_laptop
inherits: gaming_desktop

blockedActions:
  - services.disable-bluetooth-support    # Laptops use BT for controllers/headsets
  - services.disable-geolocation          # Location is useful on a portable device
  - services.disable-map-services
  - power.disable-pcie-link-state-pm      # ASPM matters for battery life
  - cpu.aggressive-boost-mode             # Thermal headroom is limited on laptops
  - cpu.min-processor-state-100
  - cpu.disable-core-parking
