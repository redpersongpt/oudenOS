# Profile: Office Laptop

profile: office_laptop
name: "Office Laptop"
description: "Battery-aware profile for office laptops. Blocks power-hungry CPU/power actions and security trade-offs."

blockedActions:
  - cpu.disable-core-parking
  - cpu.aggressive-boost-mode
  - cpu.min-processor-state-100
  - power.disable-usb-selective-suspend
  - power.disable-pcie-link-state-pm
  - security.disable-hvci
  - security.disable-vbs
