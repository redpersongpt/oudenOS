# Tasks: Telemetry & Diagnostic Tasks

module: tasks.telemetry-tasks
name: "Telemetry Task Disabling"
description: "Disable telemetry, diagnostic, and data collection scheduled tasks"
category: tasks

actions:
  - id: tasks.disable-telemetry-tasks
    name: "Disable Telemetry Collector Tasks"
    description: "Disable the Compatibility Appraiser (both the old and the 24H2 \"Exp\" name), ProgramDataUpdater, StartupAppTask and the CEIP Consolidator/UsbCeip tasks. Tasks that do not exist on this build are skipped."
    rationale: "These tasks collect and upload diagnostic data in the background, consuming CPU and network resources"
    risk: "safe"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 5
    blockedProfiles: []
    tasks:
      - name: "Microsoft Compatibility Appraiser"
        path: "\\Microsoft\\Windows\\Application Experience\\"
      - name: "Microsoft Compatibility Appraiser Exp"
        path: "\\Microsoft\\Windows\\Application Experience\\"
      - name: "ProgramDataUpdater"
        path: "\\Microsoft\\Windows\\Application Experience\\"
      - name: "StartupAppTask"
        path: "\\Microsoft\\Windows\\Application Experience\\"
      - name: "Consolidator"
        path: "\\Microsoft\\Windows\\Customer Experience Improvement Program\\"
      - name: "UsbCeip"
        path: "\\Microsoft\\Windows\\Customer Experience Improvement Program\\"

  - id: tasks.disable-diagnostic-tasks
    name: "Disable Diagnostic Data Tasks"
    description: "Disable the disk diagnostic data collector and disk-footprint diagnostics tasks (Storage Sense and the memory diagnostic are left alone)"
    rationale: "Diagnostic tasks run periodic system scans that consume I/O and CPU for data Microsoft uses for product improvement"
    risk: "safe"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 4
    blockedProfiles: []
    tasks:
      - name: "Microsoft-Windows-DiskDiagnosticDataCollector"
        path: "\\Microsoft\\Windows\\DiskDiagnostic\\"
      - name: "Diagnostics"
        path: "\\Microsoft\\Windows\\DiskFootprint\\"

  - id: tasks.disable-feedback-tasks
    name: "Disable Error Report Queue Task"
    description: "Disable the Windows Error Reporting QueueReporting task that uploads queued crash reports"
    rationale: "Error reporting tasks collect crash data and feedback prompts. Disabling prevents background crash data upload."
    risk: "safe"
    tier: "free"
    default: true
    requiresReboot: false
    reversible: true
    estimatedSeconds: 3
    blockedProfiles: []
    tasks:
      - name: "QueueReporting"
        path: "\\Microsoft\\Windows\\Windows Error Reporting\\"

  - id: tasks.disable-defender-tasks
    name: "Disable Windows Defender Scheduled Scans"
    description: "Disable Defender's scheduled scan, cache maintenance, cleanup and verification tasks. Real-time protection and manual scans are not affected."
    rationale: "Scheduled scans cause periodic disk load. Without them you must run scans yourself."
    risk: "medium"
    tier: "free"
    default: false
    expertOnly: true
    requiresReboot: false
    reversible: true
    estimatedSeconds: 4
    blockedProfiles:
      - "work_pc"
      - "office_laptop"
    warningMessage: "Defender will no longer run its periodic full scans or signature verification on a schedule. Run scans manually."
    tasks:
      - name: "Windows Defender Scheduled Scan"
        path: "\\Microsoft\\Windows\\Windows Defender\\"
      - name: "Windows Defender Cache Maintenance"
        path: "\\Microsoft\\Windows\\Windows Defender\\"
      - name: "Windows Defender Cleanup"
        path: "\\Microsoft\\Windows\\Windows Defender\\"
      - name: "Windows Defender Verification"
        path: "\\Microsoft\\Windows\\Windows Defender\\"

  - id: tasks.disable-maps-tasks
    name: "Disable Offline Maps Tasks"
    description: "Disable offline map data download and update tasks"
    rationale: "Maps tasks periodically check for and download offline map data in the background"
    risk: "safe"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles:
      - "office_laptop"
    tasks:
      - name: "MapsToastTask"
        path: "\\Microsoft\\Windows\\Maps\\"
      - name: "MapsUpdateTask"
        path: "\\Microsoft\\Windows\\Maps\\"

  - id: tasks.disable-speech-tasks
    name: "Disable Speech Model Download Task"
    description: "Disable the background speech-model download task"
    rationale: "Speech tasks collect and process speech/handwriting samples for Microsoft personalization"
    risk: "safe"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    tasks:
      - name: "SpeechModelDownloadTask"
        path: "\\Microsoft\\Windows\\Speech\\"

  - id: tasks.disable-flighting-tasks
    name: "Disable Feature Usage Reporting Tasks"
    description: "Disable the FeatureConfig usage-data reporting/flushing tasks and the OneSettings refresh task"
    rationale: "These tasks upload feature-usage data and refresh remote configuration. Feature rollout tasks (ReconcileFeatures) are intentionally left alone."
    risk: "safe"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 3
    blockedProfiles: []
    tasks:
      - name: "UsageDataReporting"
        path: "\\Microsoft\\Windows\\Flighting\\FeatureConfig\\"
      - name: "UsageDataFlushing"
        path: "\\Microsoft\\Windows\\Flighting\\FeatureConfig\\"
      - name: "RefreshCache"
        path: "\\Microsoft\\Windows\\Flighting\\OneSettings\\"
