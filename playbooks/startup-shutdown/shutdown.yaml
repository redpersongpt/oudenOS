# Startup: Shutdown Timeouts
module: startup.shutdown
name: "Shutdown Timeouts"
description: "Shorter app and service shutdown timeouts"
category: startup

actions:
  - id: shutdown.decrease-shutdown-time
    name: "Decrease Shutdown Time"
    description: "Reduce app kill timeouts for faster shutdown. Does NOT auto-end tasks — Windows will still ask before killing hung apps."
    rationale: "Lowers how long Windows waits for apps to close at shutdown (default 5000 ms). Apps that save slowly may be closed sooner."
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    registryChanges:
      - hive: "HKCU"
        path: "Control Panel\\Desktop"
        valueName: "WaitToKillAppTimeout"
        value: "3500"
        valueType: "String"
      - hive: "HKCU"
        path: "Control Panel\\Desktop"
        valueName: "HungAppTimeout"
        value: "3500"
        valueType: "String"

  - id: shutdown.force-end-apps
    name: "Shorten Service Shutdown Timeout"
    description: "Lower WaitToKillServiceTimeout to 3 seconds so services that hang at shutdown are stopped sooner. Does not force-close your apps."
    rationale: "The default is 5000 ms. A shorter value speeds up shutdown when a service hangs; well-behaved services stop well within it."
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    registryChanges:
      - hive: "HKLM"
        path: "SYSTEM\\CurrentControlSet\\Control"
        valueName: "WaitToKillServiceTimeout"
        value: "3000"
        valueType: "String"
