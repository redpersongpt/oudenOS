# Networking: Network Hardening
module: networking.security
name: "Network Hardening"
description: "Turn off LLMNR legacy name resolution"
category: networking

actions:
  - id: network.disable-llmnr
    name: "Disable LLMNR"
    description: "Disable Link-Local Multicast Name Resolution — prevents NTLM hash capture attacks"
    rationale: "LLMNR is a legacy local name-resolution protocol that can be abused to capture NTLM hashes on a hostile network. DNS and mDNS keep working; very old devices that only answer LLMNR may stop resolving by name."
    risk: "low"
    tier: "free"
    default: false
    expertOnly: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles:
      - "work_pc"
    registryChanges:
      - hive: "HKLM"
        path: "SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient"
        valueName: "EnableMulticast"
        value: 0
        valueType: "DWord"
