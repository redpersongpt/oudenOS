# Appx: Outlook & Recall Removal
module: appx.ai-copilot-removal
name: "Outlook & Recall Removal"
description: "Remove the new Outlook app and the Recall optional feature"
category: appx

actions:
  - id: appx.remove-outlook-new
    name: "Remove New Bloatlook"
    description: "Remove the new Outlook bloat Windows app that replaces Mail & Calendar"
    rationale: "Proxies all email through Microsoft servers, including non-Microsoft accounts"
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: false
    estimatedSeconds: 8
    blockedProfiles:
      - "work_pc"
      - "office_laptop"
    packages:
      - "Microsoft.OutlookForWindows"

  - id: appx.disable-recall-feature
    name: "Remove the Recall Optional Feature"
    description: "Disable the \"Recall\" Windows optional feature with Disable-WindowsOptionalFeature, run in Windows PowerShell 5.1 (PowerShell 7 can hang in DISM). Skipped when the feature is not present."
    rationale: "winutil 908c943. The Recall policies already stop Recall; this also removes the feature payload. Re-add it later with Enable-WindowsOptionalFeature -FeatureName Recall."
    risk: "medium"
    tier: "free"
    default: false
    expertOnly: false
    requiresReboot: true
    reversible: false
    estimatedSeconds: 3
    blockedProfiles: []
    minWindowsBuild: 26100
    warningMessage: "Not automatically reversible. To restore: Enable-WindowsOptionalFeature -Online -FeatureName \"Recall\" (then restart)."
    powerShellCommands:
      - |-
        & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command '$f = Get-WindowsOptionalFeature -Online -FeatureName Recall -ErrorAction SilentlyContinue; if ($f -and $f.State -ne ''Disabled'') { Disable-WindowsOptionalFeature -FeatureName Recall -Online -NoRestart -ErrorAction Stop | Out-Null }'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
