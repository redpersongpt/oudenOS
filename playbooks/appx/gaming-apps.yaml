# Appx: Xbox Apps
module: appx.gaming-apps
name: "Xbox Apps"
description: "Remove Xbox apps for PCs that never use Xbox, Game Pass or Store games"
category: appx

actions:
  - id: appx.remove-xbox-apps
    name: "Remove Xbox Apps"
    description: "Remove the Xbox app, Xbox TCUI and speech-to-text overlay. The Game Bar overlay is kept because Windows uses it to register games (Game Mode depends on that)."
    rationale: "Only for PCs that never use the Xbox app, PC Game Pass or Microsoft Store games. Removing apps rarely changes FPS; it removes background sign-in and update noise."
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: false
    estimatedSeconds: 15
    blockedProfiles:
      - "vm_cautious"
    warningMessage: "Breaks the Xbox app, PC Game Pass and Microsoft Store games that use Xbox sign-in. Reinstalling requires the Microsoft Store."
    packages:
      - "Microsoft.GamingApp"
      - "Microsoft.XboxApp"
      - "Microsoft.Xbox.TCUI"
      - "Microsoft.XboxSpeechToTextOverlay"
