# Appx: Consumer App Removal
module: appx.consumer-bloat
name: "Consumer App Removal"
description: "Remove preinstalled consumer apps, Get Office and Phone Link"
category: appx

actions:
  - id: appx.remove-consumer-bloat
    name: "Remove Preinstalled Consumer Apps"
    description: "Remove preinstalled consumer apps: News, Weather, Solitaire, People, Maps, Feedback Hub, Get Help, Tips, To Do, Cortana, Mixed Reality Portal, Skype. Packages that are not installed are skipped."
    rationale: "Removes clutter and the background updates/notifications these apps bring. Removing apps rarely changes FPS — the gain is less background noise and a cleaner Start menu. Reinstall from the Microsoft Store if needed (not available on LTSC)."
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: false
    estimatedSeconds: 15
    blockedProfiles:
      - "vm_cautious"
    packages:
      - "Microsoft.BingNews"
      - "Microsoft.BingWeather"
      - "Microsoft.MicrosoftSolitaireCollection"
      - "Microsoft.People"
      - "Microsoft.WindowsMaps"
      - "Microsoft.WindowsFeedbackHub"
      - "Microsoft.GetHelp"
      - "Microsoft.Getstarted"
      - "Microsoft.Todos"
      - "Microsoft.549981C3F5F10"
      - "Microsoft.MixedReality.Portal"
      - "Microsoft.SkypeApp"

  - id: appx.remove-office-hub
    name: "Remove Get Office Hub"
    description: "Remove the 'Get Office' promotional app that advertises Office 365"
    rationale: "Removes a pure advertising/upsell app with no functional value"
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: false
    estimatedSeconds: 8
    blockedProfiles:
      - "vm_cautious"
    packages:
      - "Microsoft.MicrosoftOfficeHub"

  - id: appx.remove-your-phone
    name: "Remove Your Phone / Phone Link"
    description: "Remove the Your Phone / Phone Link companion app"
    rationale: "Removes the Phone Link companion app and its background sync. Leave it if you pair a phone with this PC."
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: false
    estimatedSeconds: 8
    blockedProfiles:
      - "work_pc"
      - "vm_cautious"
    packages:
      - "Microsoft.YourPhone"
