# Security: Windows Update Control
module: security.update-control
name: "Windows Update Control"
description: "Delivery Optimization, feature-update deferral or pin, auto-restart and automatic updates"
category: security

actions:
  - id: security.disable-update-asap
    name: "Disable Early Access Updates"
    description: "Prevent Windows from opting in to early access / continuous innovation updates"
    rationale: "IsContinuousInnovationOptedIn pushes preview-quality updates to production machines"
    risk: "safe"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    registryChanges:
      - hive: "HKLM"
        path: "SOFTWARE\\Microsoft\\WindowsUpdate\\UX\\Settings"
        valueName: "IsContinuousInnovationOptedIn"
        value: 0
        valueType: "DWord"

  - id: security.disable-delivery-optimization
    name: "Disable Delivery Optimization"
    description: "Disable peer-to-peer Windows Update delivery that uses your bandwidth for other PCs"
    rationale: "Delivery optimization uploads update data to other PCs, consuming bandwidth"
    risk: "low"
    tier: "free"
    default: true
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    registryChanges:
      - hive: "HKLM"
        path: "SOFTWARE\\Policies\\Microsoft\\Windows\\DeliveryOptimization"
        valueName: "DODownloadMode"
        value: 0
        valueType: "DWord"

  - id: system.disable-update-auto-restart
    name: "Prevent Windows Update Auto-Restart"
    description: "Prevent Windows Update from automatically restarting the PC when a user is logged on by setting NoAutoRebootWithLoggedOnUsers to 1"
    rationale: "Asks Windows Update not to restart automatically while someone is signed in. Honored when automatic updates are policy-configured; otherwise Windows may still schedule restarts."
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles:
      - "work_pc"
    registryChanges:
      - hive: "HKLM"
        path: "SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"
        valueName: "NoAutoRebootWithLoggedOnUsers"
        value: 1
        valueType: "DWord"

  - id: system.defer-feature-updates
    name: "Defer Feature Updates by 365 Days"
    description: "Defer Windows feature updates by 365 days, allowing only security and quality updates to install while postponing major version upgrades"
    rationale: "Feature updates (e.g., 23H2 -> 24H2) often introduce driver incompatibilities, reset settings, and cause instability. Deferring them by a year lets early adopters find and report issues first."
    risk: "medium"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles:
      - "work_pc"
    registryChanges:
      - hive: "HKLM"
        path: "SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate"
        valueName: "DeferFeatureUpdates"
        value: 1
        valueType: "DWord"
      - hive: "HKLM"
        path: "SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate"
        valueName: "DeferFeatureUpdatesPeriodInDays"
        value: 365
        valueType: "DWord"

  - id: system.pin-feature-update
    name: "Stay on the Current Windows Version"
    description: "Pin Windows to the version you are running now (TargetReleaseVersion + ProductVersion + TargetReleaseVersionInfo read from DisplayVersion). Security and quality updates keep installing; feature upgrades are held. May be ignored on Windows 11 Home."
    rationale: "PC-Tuning 25c0e2e (\"disable feature updates\"). Honored on Pro/Enterprise/Education (may be ignored on Windows 11 Home); on LTSC feature updates are not offered anyway. Once your version leaves support you must remove the pin to keep getting security updates."
    risk: "medium"
    tier: "free"
    default: false
    expertOnly: false
    requiresReboot: false
    reversible: false
    estimatedSeconds: 3
    blockedProfiles: []
    warningMessage: "Not automatically reversible. To undo, delete TargetReleaseVersion, ProductVersion and TargetReleaseVersionInfo under HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate. Remove the pin before your version reaches end of support."
    powerShellCommands:
      - |-
        $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
        $product = if ([int]$cv.CurrentBuild -ge 22000) { 'Windows 11' } else { 'Windows 10' }
        $wu = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
        if (-not (Test-Path $wu)) { New-Item -Path $wu -Force | Out-Null }
        New-ItemProperty -Path $wu -Name TargetReleaseVersion -PropertyType DWord -Value 1 -Force | Out-Null
        New-ItemProperty -Path $wu -Name ProductVersion -PropertyType String -Value $product -Force | Out-Null
        New-ItemProperty -Path $wu -Name TargetReleaseVersionInfo -PropertyType String -Value ([string]$cv.DisplayVersion) -Force | Out-Null

  - id: system.disable-auto-update
    name: "Turn Off Automatic Windows Updates"
    description: "Set the NoAutoUpdate policy so Windows Update never downloads or installs updates on its own. You must check for updates manually."
    rationale: "PC-Tuning registry option \"disable automatic windows updates\". Security updates stop arriving unless you install them yourself."
    risk: "high"
    tier: "free"
    default: false
    expertOnly: true
    requiresReboot: false
    reversible: true
    estimatedSeconds: 3
    blockedProfiles: []
    warningMessage: "Security updates no longer install automatically. Check Windows Update manually and regularly. Reversible."
    registryChanges:
      - hive: "HKLM"
        path: "SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"
        valueName: "NoAutoUpdate"
        value: 1
        valueType: "DWord"
