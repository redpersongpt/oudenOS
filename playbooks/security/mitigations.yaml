# Security: Security Mitigations
module: security.mitigations
name: "Security Mitigations"
description: "Memory Integrity (HVCI) and CPU mitigation options. Opt-in only; benchmark before and after."
category: security

actions:
  - id: security.disable-hvci
    name: "Disable Hypervisor-enforced Code Integrity"
    description: "Disable HVCI (Hypervisor-enforced Code Integrity) which validates kernel-mode code integrity using the hypervisor, adding overhead to every driver load and some system calls"
    rationale: "Turns off Memory Integrity (HVCI). This weakens kernel protection against malicious drivers. Some anti-cheat systems (Vanguard, FACEIT) may require HVCI and/or Kernel DMA Protection. No repeatable FPS gain is promised. Measure before/after with a frame-time capture (PresentMon or CapFrameX, several runs) — no repeatable gain is promised."
    risk: "high"
    tier: "free"
    default: false
    expertOnly: true
    requiresReboot: true
    reversible: true
    estimatedSeconds: 3
    blockedProfiles:
      - "work_pc"
      - "office_laptop"
      - "vm_cautious"
    warningMessage: "Memory Integrity protects the kernel from malicious or vulnerable drivers. Vanguard (Valorant/League) and FACEIT may refuse to run without HVCI, TPM 2.0 or Secure Boot. Reversible: turn Memory Integrity back on in Windows Security > Device security > Core isolation."
    registryChanges:
      - hive: "HKLM"
        path: "SYSTEM\\CurrentControlSet\\Control\\DeviceGuard\\Scenarios\\HypervisorEnforcedCodeIntegrity"
        valueName: "Enabled"
        value: 0
        valueType: "DWord"

  - id: security.disable-cpu-mitigations
    name: "Disable CPU Microcode Mitigations (Spectre/Meltdown)"
    description: "Disable Spectre/Meltdown CPU mitigations by renaming the microcode update DLLs. Affects mcupdate_GenuineIntel.dll (Intel) or mcupdate_AuthenticAMD.dll (AMD). Requires TrustedInstaller privileges."
    rationale: "Disables Spectre v2/Meltdown OS mitigations (FeatureSettingsOverride=3/Mask=3) and renames the microcode-update DLL. PC-Tuning 11.30 warns that on newer platforms this can REDUCE performance, that Meltdown does not affect AMD, and that FACEIT requires the mitigations. Benchmark before and after; revert if it is not faster. Measure before/after with a frame-time capture (PresentMon or CapFrameX, several runs) — no repeatable gain is promised."
    risk: "extreme"
    tier: "premium"
    default: false
    expertOnly: true
    requiresReboot: true
    reversible: true
    estimatedSeconds: 10
    blockedProfiles:
      - "work_pc"
      - "office_laptop"
      - "vm_cautious"
      - "low_spec_system"
    warningMessage: "Exposes the system to Spectre/Meltdown-class attacks, can be slower on newer CPUs, and FACEIT requires the mitigations. Requires TrustedInstaller. Revert if it does not help."
    registryChanges:
      - hive: "HKLM"
        path: "SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management"
        valueName: "FeatureSettingsOverride"
        value: 3
        valueType: "DWord"
      - hive: "HKLM"
        path: "SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management"
        valueName: "FeatureSettingsOverrideMask"
        value: 3
        valueType: "DWord"
    fileRenames:
      - source: "C:\\Windows\\System32\\mcupdate_GenuineIntel.dll"
        target: "C:\\Windows\\System32\\mcupdate_GenuineIntel.dll.bak"
        requiresTrustedInstaller: true
        cpuVendor: "Intel"
      - source: "C:\\Windows\\System32\\mcupdate_AuthenticAMD.dll"
        target: "C:\\Windows\\System32\\mcupdate_AuthenticAMD.dll.bak"
        requiresTrustedInstaller: true
        cpuVendor: "AMD"
