# Security: Defender & VBS Policies
module: security.defender-control
name: "Defender & VBS Policies"
description: "Policy-level Defender, VBS/Credential Guard and driver-blocklist options. Opt-in only; Defender policies are ignored while Tamper Protection is on."
category: security

actions:
  - id: security.disable-defender-realtime
    name: "Turn Off Defender Real-Time Protection (policy)"
    description: "Set the Defender real-time protection policies (real-time monitoring, behaviour monitoring, on-access, downloads/attachments (IOAV) and scan-on-enable). Microsoft Defender ignores these policies while Tamper Protection is on, which is the default (the change may appear to succeed but has no effect) — turn Tamper Protection off in Windows Security first."
    rationale: "Policy-level only. The obsolete DisableAntiSpyware value is not used (ignored since Defender platform 4.18.2007.8), and Defender's services cannot be disabled by an administrator process, so oudenOS does not attempt it. Scanning overhead is mostly visible during installs and game updates, not in-game. Measure before/after with a frame-time capture (PresentMon or CapFrameX, several runs) — no repeatable gain is promised."
    risk: "high"
    tier: "free"
    default: false
    expertOnly: true
    requiresReboot: true
    reversible: true
    estimatedSeconds: 5
    blockedProfiles:
      - "work_pc"
      - "office_laptop"
      - "vm_cautious"
    warningMessage: "Removes real-time malware protection. Ignored while Tamper Protection is on. Some anti-cheats may expect Defender running. Reversible (policy values are restored on rollback)."
    registryChanges:
      - hive: "HKLM"
        path: "SOFTWARE\\Policies\\Microsoft\\Windows Defender\\Real-Time Protection"
        valueName: "DisableRealtimeMonitoring"
        value: 1
        valueType: "DWord"
      - hive: "HKLM"
        path: "SOFTWARE\\Policies\\Microsoft\\Windows Defender\\Real-Time Protection"
        valueName: "DisableBehaviorMonitoring"
        value: 1
        valueType: "DWord"
      - hive: "HKLM"
        path: "SOFTWARE\\Policies\\Microsoft\\Windows Defender\\Real-Time Protection"
        valueName: "DisableOnAccessProtection"
        value: 1
        valueType: "DWord"
      - hive: "HKLM"
        path: "SOFTWARE\\Policies\\Microsoft\\Windows Defender\\Real-Time Protection"
        valueName: "DisableScanOnRealtimeEnable"
        value: 1
        valueType: "DWord"
      - hive: "HKLM"
        path: "SOFTWARE\\Policies\\Microsoft\\Windows Defender\\Real-Time Protection"
        valueName: "DisableIOAVProtection"
        value: 1
        valueType: "DWord"

  - id: security.disable-defender-cloud
    name: "Disable Defender Cloud Protection"
    description: "Turn off Defender cloud-delivered protection (MAPS) and automatic sample submission via policy. Ignored while Tamper Protection is on."
    rationale: "Cloud lookups send file metadata/samples to Microsoft and catch threats local signatures miss. Policy-level only."
    risk: "medium"
    tier: "free"
    default: false
    expertOnly: true
    requiresReboot: false
    reversible: true
    estimatedSeconds: 3
    blockedProfiles:
      - "work_pc"
    warningMessage: "New threats that only cloud protection would catch may be missed. Ignored while Tamper Protection is on. Reversible."
    registryChanges:
      - hive: "HKLM"
        path: "SOFTWARE\\Policies\\Microsoft\\Windows Defender\\Spynet"
        valueName: "SpyNetReporting"
        value: 0
        valueType: "DWord"
      - hive: "HKLM"
        path: "SOFTWARE\\Policies\\Microsoft\\Windows Defender\\Spynet"
        valueName: "SubmitSamplesConsent"
        value: 2
        valueType: "DWord"

  - id: security.disable-vbs
    name: "Turn Off Virtualization-Based Security (VBS) and Credential Guard"
    description: "Request VBS off: EnableVirtualizationBasedSecurity=0 (system and policy), Memory Integrity off, and Credential Guard off (LsaCfgFlags=0 in both locations — Credential Guard is on by default on Windows 11 22H2+ Enterprise/Education). Needs a reboot. Hyper-V, WSL2, Windows Sandbox or Virtual Machine Platform keep the hypervisor running."
    rationale: "PC-Tuning removed its registry command for this (57e7508) because firmware-locked configurations ignore it; on such systems the only way is disabling SVM/VT-x and IOMMU in the BIOS. Check System Information (\"Virtualization-based security\") after rebooting. Measure before/after with a frame-time capture (PresentMon or CapFrameX, several runs) — no repeatable gain is promised."
    risk: "high"
    tier: "free"
    default: false
    expertOnly: true
    requiresReboot: true
    reversible: true
    estimatedSeconds: 3
    blockedProfiles:
      - "work_pc"
      - "office_laptop"
      - "vm_cautious"
    warningMessage: "Weakens credential and kernel protection. If Credential Guard/VBS was enabled with a UEFI lock, these values are ignored: Microsoft's documented way out is the SecConfig.efi boot entry (loadoptions DISABLE-LSA-ISO) confirmed at the keyboard on the next boot; disabling SVM/VT-x in the firmware is the fallback. Riot's support pages say Vanguard may require Memory Integrity (HVCI/VBS), TPM 2.0, Secure Boot and IOMMU depending on the system, and VALORANT's optional On-Demand Vanguard mode requires VBS + HVCI; FACEIT may require them too (THE FINALS requires Secure Boot). Reversible unless UEFI-locked."
    registryChanges:
      - hive: "HKLM"
        path: "SYSTEM\\CurrentControlSet\\Control\\DeviceGuard"
        valueName: "EnableVirtualizationBasedSecurity"
        value: 0
        valueType: "DWord"
      - hive: "HKLM"
        path: "SOFTWARE\\Policies\\Microsoft\\Windows\\DeviceGuard"
        valueName: "EnableVirtualizationBasedSecurity"
        value: 0
        valueType: "DWord"
      - hive: "HKLM"
        path: "SYSTEM\\CurrentControlSet\\Control\\DeviceGuard\\Scenarios\\HypervisorEnforcedCodeIntegrity"
        valueName: "Enabled"
        value: 0
        valueType: "DWord"
      - hive: "HKLM"
        path: "SYSTEM\\CurrentControlSet\\Control\\Lsa"
        valueName: "LsaCfgFlags"
        value: 0
        valueType: "DWord"
      - hive: "HKLM"
        path: "SOFTWARE\\Policies\\Microsoft\\Windows\\DeviceGuard"
        valueName: "LsaCfgFlags"
        value: 0
        valueType: "DWord"

  - id: security.disable-vulnerable-driver-blocklist
    name: "Disable Vulnerable Driver Blocklist"
    description: "Disable the Microsoft Vulnerable Driver Blocklist that prevents certain drivers from loading"
    rationale: "Lets drivers on Microsoft's vulnerable-driver blocklist load. Some low-level tuning tools (e.g. RW-Everything for XHCI IMOD tuning) need it; anti-cheats may object."
    risk: "high"
    tier: "premium"
    default: false
    expertOnly: true
    requiresReboot: true
    reversible: true
    estimatedSeconds: 2
    blockedProfiles:
      - "work_pc"
      - "office_laptop"
    warningMessage: "Allows potentially vulnerable drivers to load. Only disable if you need specific kernel tools like RW-Everything for XHCI IMOD or MSI utility."
    registryChanges:
      - hive: "HKLM"
        path: "SYSTEM\\CurrentControlSet\\Control\\CI\\Config"
        valueName: "VulnerableDriverBlocklistEnable"
        value: 0
        valueType: "DWord"
