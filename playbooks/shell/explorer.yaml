# Shell: Explorer Settings

module: shell.explorer
name: "Explorer Settings"
description: "Improve File Explorer usability — show extensions, show hidden files, clean navigation"
category: shell

actions:
  - id: shell.show-file-extensions
    name: "Show File Extensions"
    description: "Show file extensions in File Explorer for all file types"
    rationale: "Improves file identification and security awareness (hidden extensions can mask malware)"
    risk: "safe"
    tier: "free"
    default: true
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    registryChanges:
      - hive: "HKCU"
        path: "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced"
        valueName: "HideFileExt"
        value: 0
        valueType: "DWord"

  - id: shell.show-hidden-files
    name: "Show Hidden Files"
    description: "Display hidden files and folders in File Explorer"
    rationale: "Power users need to see hidden files for configuration and troubleshooting"
    risk: "safe"
    tier: "free"
    default: false
    expertOnly: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    registryChanges:
      - hive: "HKCU"
        path: "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced"
        valueName: "Hidden"
        value: 1
        valueType: "DWord"

  - id: shell.explorer-default-this-pc
    name: "Open Explorer to This PC"
    description: "Set File Explorer to open to This PC instead of Home/Quick Access"
    rationale: "This PC view shows drives and system info, more useful than recent files"
    risk: "safe"
    tier: "free"
    default: true
    expertOnly: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    registryChanges:
      - hive: "HKCU"
        path: "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced"
        valueName: "LaunchTo"
        value: 1
        valueType: "DWord"

  - id: shell.remove-home-gallery
    name: "Hide Home and Gallery in Explorer"
    description: "Hide the Home and Gallery entries in the File Explorer navigation pane (winutil RemoveHomeAndGallery). Pair it with \"Open Explorer to This PC\"."
    rationale: "Per-user, reversible."
    risk: "low"
    tier: "free"
    default: false
    expertOnly: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 3
    blockedProfiles: []
    minWindowsBuild: 22621
    registryChanges:
      - hive: "HKCU"
        path: "Software\\Classes\\CLSID\\{f874310e-b6b7-47dc-bc84-b9e6b38f5903}"
        valueName: "System.IsPinnedToNameSpaceTree"
        value: 0
        valueType: "DWord"
      - hive: "HKCU"
        path: "Software\\Classes\\CLSID\\{e88865ea-0e1c-4e20-9aa6-edcd0212c87c}"
        valueName: "System.IsPinnedToNameSpaceTree"
        value: 0
        valueType: "DWord"

  - id: shell.enable-long-paths
    name: "Enable Long File Paths"
    description: "Allow paths longer than 260 characters for apps that support it (LongPathsEnabled=1)"
    rationale: "Mainly useful for developers and deep folder trees. Safe and reversible."
    risk: "safe"
    tier: "free"
    default: false
    expertOnly: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 3
    blockedProfiles: []
    registryChanges:
      - hive: "HKLM"
        path: "SYSTEM\\CurrentControlSet\\Control\\FileSystem"
        valueName: "LongPathsEnabled"
        value: 1
        valueType: "DWord"
