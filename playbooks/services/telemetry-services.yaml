# Services: Telemetry & Diagnostic Services

module: services.telemetry-services
name: "Telemetry & Diagnostic Services"
description: "Disable Windows telemetry, diagnostic, and data-collection background services"
category: services

actions:
  - id: services.disable-diagtrack
    name: "Disable Connected User Experiences (DiagTrack)"
    description: "Disable the Connected User Experiences and Telemetry service (DiagTrack) — primary Windows telemetry pipeline"
    rationale: "Main telemetry pipeline — collects diagnostic data, usage patterns, and crash reports, uploads to Microsoft"
    risk: "safe"
    tier: "free"
    default: true
    requiresReboot: false
    reversible: true
    estimatedSeconds: 3
    blockedProfiles: []
    serviceChanges:
      - name: "DiagTrack"
        startupType: "Disabled"

  - id: services.disable-dmwappushservice
    name: "Disable WAP Push Message Routing"
    description: "Disable dmwappushservice — routes telemetry data from DiagTrack to Microsoft"
    rationale: "Secondary telemetry relay for DiagTrack, can still upload data independently"
    risk: "safe"
    tier: "free"
    default: true
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    serviceChanges:
      - name: "dmwappushservice"
        startupType: "Disabled"

  - id: services.disable-sysmain
    name: "Disable SysMain (Superfetch)"
    description: "Disable the SysMain service (formerly Superfetch) which preloads frequently used applications into memory"
    rationale: "SysMain preloads frequently used apps using background disk I/O. PC-Tuning (11.18) only recommends disabling it when no HDD is present, so this is skipped on systems with a spinning disk. Benefit on SSD-only systems is small."
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 3
    blockedProfiles:
      - "work_pc"
    requires:
      noHdd: true
    serviceChanges:
      - name: "SysMain"
        startupType: "Disabled"

  - id: services.disable-wisvc
    name: "Disable Windows Insider Service"
    description: "Disable wisvc — Windows Insider Program flight/preview management"
    rationale: "Only needed when the PC is enrolled in the Windows Insider Program."
    risk: "safe"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    serviceChanges:
      - name: "wisvc"
        startupType: "Disabled"

  - id: services.disable-retaildemo
    name: "Disable Retail Demo Service"
    description: "Disable RetailDemo — retail store demo experience management"
    rationale: "Only used in retail store display mode"
    risk: "safe"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    serviceChanges:
      - name: "RetailDemo"
        startupType: "Disabled"

  - id: services.disable-map-services
    name: "Disable Downloaded Maps Manager"
    description: "Disable MapsBroker — the offline-maps download manager"
    rationale: "Only used by the Maps app's offline maps. Location (lfsvc) is handled by the geolocation action."
    risk: "safe"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 3
    blockedProfiles:
      - "office_laptop"
    serviceChanges:
      - name: "MapsBroker"
        startupType: "Disabled"

  - id: services.disable-diagnostic-policy-host-collector
    name: "Disable Diagnostics Hub Standard Collector"
    description: "Disable diagnosticshub.standardcollector.service — the ETW trace collector used by Visual Studio diagnostics"
    rationale: "Collects ETW traces for Visual Studio profiling. Absent on some editions (skipped there). Re-enable if you profile apps with Visual Studio."
    risk: "safe"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    serviceChanges:
      - name: "diagnosticshub.standardcollector.service"
        startupType: "Disabled"

  - id: services.disable-diagnostic-execution
    name: "Disable Diagnostic Execution Service (diagsvc)"
    description: "Disable diagsvc, the service that runs scenario-based diagnostics"
    rationale: "Runs background diagnostic scenarios. Disabling frees the resource; the only cost is the automated troubleshooters."
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    warningMessage: "The built-in 'Get Help / Troubleshoot' automated wizards (legacy MSDT troubleshooters) may not run while this is off. Re-enable if you need a Windows troubleshooter."
    serviceChanges:
      - name: "diagsvc"
        startupType: "Disabled"
