# Performance: GPU & Game Capture
module: performance.gpu
name: "GPU & Game Capture"
description: "Game capture, fullscreen behaviour, GPU timeout and GPU-vendor background services"
category: performance

actions:
  - id: gpu.tdr-delay
    name: "Increase TDR Timeout to 10 Seconds"
    description: "Increase the Timeout Detection and Recovery (TDR) delay from the default 2 seconds to 10 seconds, preventing false GPU resets during heavy load spikes"
    rationale: "The default 2-second GPU timeout can trigger false \"display driver stopped responding\" resets during long shader compiles or compute loads. 10 seconds gives the driver more time; a real hang then takes longer to recover."
    risk: "low"
    tier: "premium"
    default: true
    requiresReboot: true
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    registryChanges:
      - hive: "HKLM"
        path: "SYSTEM\\CurrentControlSet\\Control\\GraphicsDrivers"
        valueName: "TdrDelay"
        value: 10
        valueType: "DWord"
      - hive: "HKLM"
        path: "SYSTEM\\CurrentControlSet\\Control\\GraphicsDrivers"
        valueName: "TdrDdiDelay"
        value: 10
        valueType: "DWord"

  - id: perf.disable-game-dvr
    name: "Disable Game DVR Background Recording"
    description: "Turn off Game DVR / background capture (the \"record what happened\" buffer). Game Bar itself stays installed and usable."
    rationale: "Upstream PC-Tuning toggle pair (AppCaptureEnabled, GameDVR_Enabled). Background recording keeps a video-encode buffer running. Game Bar is still needed to register games (\"Remember this is a game\"), so it is not removed. Measure before/after with a frame-time capture (PresentMon or CapFrameX, several runs) — no repeatable gain is promised."
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 3
    blockedProfiles: []
    registryChanges:
      - hive: "HKCU"
        path: "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\GameDVR"
        valueName: "AppCaptureEnabled"
        value: 0
        valueType: "DWord"
      - hive: "HKCU"
        path: "System\\GameConfigStore"
        valueName: "GameDVR_Enabled"
        value: 0
        valueType: "DWord"

  - id: perf.disable-fullscreen-optimizations
    name: "Prefer Exclusive Fullscreen (system-wide FSO off)"
    description: "Set the system-wide GameConfigStore values that make fullscreen games prefer exclusive fullscreen over fullscreen optimizations. A game's own compatibility setting still wins."
    rationale: "Exact keys from PC-Tuning 11.42.4 (GameDVR_FSEBehavior=2, GameDVR_DXGIHonorFSEWindowsCompatible=1). PC-Tuning stresses this is not a recommendation of which presentation mode to use: try the per-game \"Disable fullscreen optimizations\" checkbox first. Exclusive fullscreen also turns off Windows colour management/Auto HDR for that game. Measure before/after with a frame-time capture (PresentMon or CapFrameX, several runs) — no repeatable gain is promised."
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles:
      - "work_pc"
    registryChanges:
      - hive: "HKCU"
        path: "System\\GameConfigStore"
        valueName: "GameDVR_FSEBehavior"
        value: 2
        valueType: "DWord"
      - hive: "HKCU"
        path: "System\\GameConfigStore"
        valueName: "GameDVR_DXGIHonorFSEWindowsCompatible"
        value: 1
        valueType: "DWord"

  - id: perf.disable-transparency
    name: "Disable Window Transparency Effects"
    description: "Disable window transparency effects (acrylic, blur) that use GPU compositing for translucent title bars and taskbar"
    rationale: "Cosmetic: removes acrylic/blur effects. The GPU cost of these effects is tiny on modern hardware; choose it if you prefer the look."
    risk: "safe"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    registryChanges:
      - hive: "HKCU"
        path: "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Themes\\Personalize"
        valueName: "EnableTransparency"
        value: 0
        valueType: "DWord"

  - id: gpu.disable-nvidia-container
    name: "Disable Nvidia Container Services"
    description: "Disable NVDisplay.ContainerLocalSystem and NvContainerLocalSystem background services that run telemetry, overlay, and update checks."
    rationale: "Stops the NVIDIA container services. No repeatable FPS gain has been measured; offered for users who do not use NVIDIA's control software."
    risk: "medium"
    tier: "free"
    default: false
    expertOnly: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 3
    blockedProfiles:
      - "vm_cautious"
    requires:
      gpuVendor: "nvidia"
    warningMessage: "Disabling the NVIDIA display container (NVDisplay.ContainerLocalSystem) breaks NVIDIA Control Panel and NVIDIA App features; the overlay, recording and automatic driver updates also stop. Re-enable the services to get them back."
    serviceChanges:
      - name: "NVDisplay.ContainerLocalSystem"
        startupType: "Disabled"
      - name: "NvContainerLocalSystem"
        startupType: "Disabled"

  - id: gpu.disable-amd-services
    name: "Disable AMD Background Services"
    description: "Disable the AMD Crash Defender and AMD User Experience Program launcher services"
    rationale: "Background crash reporting and UX-program services. No repeatable FPS gain has been measured. The External Events Utility (FreeSync) is intentionally left alone."
    risk: "low"
    tier: "free"
    default: false
    expertOnly: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 3
    blockedProfiles:
      - "vm_cautious"
    requires:
      gpuVendor: "amd"
    warningMessage: "AMD crash reporting and the UX-program launcher stop. Adrenalin and FreeSync keep working."
    serviceChanges:
      - name: "AMD Crash Defender Service"
        startupType: "Disabled"
      - name: "AUEPLauncher"
        startupType: "Disabled"
