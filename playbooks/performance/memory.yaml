# Performance: Memory Management
module: performance.memory
name: "Memory Management"
description: "Memory compression, Prefetch and svchost grouping (opt-in)"
category: performance

actions:
  - id: memory.disable-compression
    name: "Disable Memory Compression"
    description: "Disable the Windows memory compression agent that compresses idle pages instead of writing to page file"
    rationale: "Memory compression trades a little CPU for less paging. On systems with plenty of RAM some users prefer it off; on 16 GB or less keep it on. Measure before/after with a frame-time capture (PresentMon or CapFrameX, several runs) — no repeatable gain is promised."
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: true
    reversible: true
    estimatedSeconds: 5
    blockedProfiles:
      - "low_spec_system"
      - "vm_cautious"
    powerShellCommands:
      - |-
        $svc = Get-Service SysMain -ErrorAction Stop
        $mode = (Get-CimInstance Win32_Service -Filter "Name='SysMain'").StartMode
        if ($svc.Status -ne 'Running') {
          if ($mode -eq 'Disabled') { Set-Service SysMain -StartupType Manual }
          Start-Service SysMain
        }
        Disable-MMAgent -MemoryCompression
        if ($mode -eq 'Disabled') {
          Stop-Service SysMain -Force -ErrorAction SilentlyContinue
          Set-Service SysMain -StartupType Disabled
        }

  - id: perf.disable-prefetch
    name: "Disable Prefetch"
    description: "Disable Prefetch/ReadyBoot subsystem that preloads application data on boot"
    rationale: "Prefetch speeds up launches mainly on HDDs. PC-Tuning (11.18) only suggests disabling it when no HDD is present, so it is skipped otherwise. Expect no FPS change."
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: true
    reversible: true
    estimatedSeconds: 3
    blockedProfiles:
      - "work_pc"
    requires:
      noHdd: true
    registryChanges:
      - hive: "HKLM"
        path: "SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management\\PrefetchParameters"
        valueName: "EnablePrefetcher"
        value: 0
        valueType: "DWord"
      - hive: "HKLM"
        path: "SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management\\PrefetchParameters"
        valueName: "EnableSuperfetch"
        value: 0
        valueType: "DWord"

  - id: perf.svchost-split-threshold
    name: "Optimize Svchost Split Threshold"
    description: "Stop Windows from splitting services into separate svchost.exe processes by raising the split threshold above your RAM size (0xFFFFFFFF). Fewer processes, slightly less memory."
    rationale: "A threshold above physical memory disables svchost splitting. winutil (2f0bdc8, #5115) found this can leave XboxGipSvc stuck \"Starting\" (Xbox controllers), so it is blocked on gaming profiles and mainly useful on PCs with 12 GB of RAM or less."
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: true
    reversible: true
    estimatedSeconds: 2
    blockedProfiles:
      - "vm_cautious"
      - "gaming_desktop"
      - "gaming_laptop"
    warningMessage: "May leave Xbox accessory services (controllers) stuck on \"Starting\" and reduces service isolation. Reversible."
    registryChanges:
      - hive: "HKLM"
        path: "SYSTEM\\CurrentControlSet\\Control"
        valueName: "SvcHostSplitThresholdInKB"
        value: 4294967295
        valueType: "DWord"
