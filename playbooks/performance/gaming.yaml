# Performance: Input & Filesystem
module: performance.gaming
name: "Input & Filesystem"
description: "Pointer acceleration and NTFS short-name settings"
category: performance

actions:
  - id: perf.ntfs-optimization
    name: "Disable NTFS 8.3 Short-Name Creation"
    description: "Stop NTFS creating DOS-style 8.3 short names for new files (same as fsutil 8dot3name set 1). Existing short names are kept."
    rationale: "Short-name generation is a legacy compatibility feature. Very old installers that rely on 8.3 names may misbehave. Expect no FPS change."
    risk: "low"
    tier: "free"
    default: false
    requiresReboot: true
    reversible: true
    estimatedSeconds: 3
    blockedProfiles:
      - "work_pc"
    registryChanges:
      - hive: "HKLM"
        path: "SYSTEM\\CurrentControlSet\\Control\\FileSystem"
        valueName: "NtfsDisable8dot3NameCreation"
        value: 1
        valueType: "DWord"

  - id: perf.disable-pointer-acceleration
    name: "Disable Mouse Pointer Acceleration"
    description: "Set mouse acceleration to 1:1 (6/11 speed, no acceleration curve)"
    rationale: "Turns off \"Enhance pointer precision\" for a 1:1 desktop cursor. Most modern games use raw input and ignore this setting (PC-Tuning 3f49c12); it mainly affects the desktop and older games. A preference, not a performance tweak."
    risk: "safe"
    tier: "free"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 2
    blockedProfiles: []
    registryChanges:
      - hive: "HKCU"
        path: "Control Panel\\Mouse"
        valueName: "MouseSpeed"
        value: "0"
        valueType: "String"
      - hive: "HKCU"
        path: "Control Panel\\Mouse"
        valueName: "MouseThreshold1"
        value: "0"
        valueType: "String"
      - hive: "HKCU"
        path: "Control Panel\\Mouse"
        valueName: "MouseThreshold2"
        value: "0"
        valueType: "String"
