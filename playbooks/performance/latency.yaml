# Performance: CPU Power Policy
module: performance.latency
name: "CPU Power Policy"
description: "Opt-in processor power-policy settings (core parking, boost mode, minimum processor state). Benchmark them on your own system."
category: performance

actions:
  - id: cpu.disable-core-parking
    name: "Disable CPU Core Parking"
    description: "Set the minimum number of unparked cores to 100% on AC power in the active power plan, so Windows never parks cores."
    rationale: "Core parking saves power by idling cores. Disabling it raises idle power and heat; on many modern CPUs (especially Ryzen X3D) no gain is measurable. Measure before/after with a frame-time capture (PresentMon or CapFrameX, several runs) — no repeatable gain is promised."
    risk: "low"
    tier: "premium"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 3
    blockedProfiles:
      - "office_laptop"
      - "low_spec_system"
    powerChanges:
      - settingPath: "54533251-82be-4824-96c1-47b60b740d00/0cc5b647-c1df-4637-891a-dec35c318583"
        newValue: "100"

  - id: cpu.aggressive-boost-mode
    name: "Aggressive Processor Boost Mode"
    description: "Set processor performance boost policy to Aggressive (mode 2). This prioritizes sustained maximum turbo frequency over power efficiency."
    rationale: "Sets the processor boost policy to Aggressive on AC power. Raises power and heat; gains are workload- and CPU-dependent. Measure before/after with a frame-time capture (PresentMon or CapFrameX, several runs) — no repeatable gain is promised."
    risk: "low"
    tier: "premium"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 3
    blockedProfiles:
      - "office_laptop"
      - "low_spec_system"
    powerChanges:
      - settingPath: "54533251-82be-4824-96c1-47b60b740d00/be337238-0d82-4146-a960-4f3749d470c7"
        newValue: "2"

  - id: cpu.min-processor-state-100
    name: "Set Minimum Processor State to 100% (current plan)"
    description: "Hold the active power plan's minimum (and maximum) processor state at 100% on AC power. Does not switch power plans and does not mean 100% CPU usage, but raises idle power draw, heat and fan noise."
    rationale: "Some users prefer a fixed clock floor. Do not assume it beats Balanced: on AMD Ryzen X3D CPUs Balanced is often equal or better. Benchmark Balanced vs this setting on your own system. Measure before/after with a frame-time capture (PresentMon or CapFrameX, several runs) — no repeatable gain is promised."
    risk: "low"
    tier: "premium"
    default: false
    requiresReboot: false
    reversible: true
    estimatedSeconds: 3
    blockedProfiles:
      - "office_laptop"
      - "low_spec_system"
    powerChanges:
      - settingPath: "54533251-82be-4824-96c1-47b60b740d00/893dee8e-2bef-41e0-89c6-b55d0929964c"
        newValue: "100"
      - settingPath: "54533251-82be-4824-96c1-47b60b740d00/bc5038f7-23e0-4960-96da-33abaf5935ec"
        newValue: "100"
